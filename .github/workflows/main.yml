name: Main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: push

env:
  # Change this to invalidate existing cache.
  CACHE_PREFIX: v0
  PYTHONPATH: ./

jobs:
  checks:
    name: Python ${{ matrix.python }} - ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
        task:
        - name: Test
          run: |
            playwright install chromium
            pytest -v --color=yes -m "not nonci" tests/

        include:
        - python: '3.11'
          task:
            name: Lint
            run: ruff check .

          # Removing mypy for now, as it isn't handling async things correctly and crashing
          # - python: "3.11"
          #   task:
          #     name: Type check
          #     run: mypy .

        - python: '3.11'
          task:
            name: Build
            run: |
              python -m build

        - python: '3.11'
          task:
            name: Style
            run: |
              isort --check .
              black --check .

        - python: '3.11'
          task:
            name: Docs
            run: |
              cd docs && make html

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends poppler-utils

    - name: Setup Python environment
      uses: ./.github/actions/setup-venv
      with:
        python-version: ${{ matrix.python }}
        cache-prefix: ${{ env.CACHE_PREFIX }}

    - name: Restore mypy cache
      if: matrix.task.name == 'Type check'
      uses: actions/cache@v3
      with:
        path: .mypy_cache
        key: mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{
          hashFiles('*requirements.txt') }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('*requirements.txt') }}-${{ github.ref }}
          mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('*requirements.txt') }}

    - name: ${{ matrix.task.name }}
      run: |
        . .venv/bin/activate
        ${{ matrix.task.run }}

    - name: Upload package distribution files
      if: matrix.task.name == 'Build'
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: dist

    - name: Clean up
      if: always()
      run: |
        . .venv/bin/activate
        pip uninstall -y olmocr
